[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "filepromptforge"
version = "2.0.0"
description = "FilePromptForge - LLM-powered document generation with mandatory grounding and reasoning"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Morgan Ross", email = "morganross@rossmorr.com"},
]
maintainers = [
    {name = "Morgan Ross", email = "morganross@rossmorr.com"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["llm", "openai", "gemini", "anthropic", "grounding", "reasoning", "web-search"]

dependencies = [
    "openai>=1.0.0",
    "google-generativeai>=0.3.0",
    "anthropic>=0.8.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "ruff>=0.1.0",
]
perplexity = ["httpx>=0.24.0"]
tavily = ["tavily-python>=0.2.0"]

[project.scripts]
fpf = "FilePromptForge.fpf_main:main"
fpf-cli = "FilePromptForge.fpf_main:main"

[tool.setuptools]
package-dir = {"" = "."}
packages = ["FilePromptForge"]

[tool.setuptools.package-data]
"FilePromptForge" = [
    "*.yaml",
    "providers/**/*.yaml",
    "pricing/*.json",
    "test/**/*",
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
