[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filepromptforge"
version = "0.1.0"
description = "FilePromptForge - LLM-powered document generation with mandatory grounding and reasoning"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Morgan Ross", email = "morganross@rossmorr.com"},
]
maintainers = [
    {name = "Morgan Ross", email = "morganross@rossmorr.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = ["llm", "openai", "gemini", "anthropic", "grounding", "reasoning", "web-search"]

dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "platformdirs>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "build>=1.2",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.scripts]
fpf = "FilePromptForge.fpf_main:main"
fpf-cli = "FilePromptForge.fpf_main:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["FilePromptForge*"]
namespaces = true

[tool.setuptools.package-data]
"FilePromptForge" = [
    "*.yaml",
    "providers/**/*.yaml",
    "pricing/*.json",
    "test/**/*",
]

[project.urls]
Homepage = "https://github.com/morganross/FilePromptForge"
Repository = "https://github.com/morganross/FilePromptForge"
Issues = "https://github.com/morganross/FilePromptForge/issues"
Changelog = "https://github.com/morganross/FilePromptForge/blob/master/CHANGELOG.md"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
